[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-fastapi-connector"
version = "0.1.0"
description = "Allowlisted pseudonymous delegated-access reporting for AEGIS"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[tool.setuptools]
packages = ["aegis_connector"]
