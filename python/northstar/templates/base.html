<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Finance · Fictional demo</title><style>
:root{color-scheme:light;--ink:#163c36;--muted:#6a827a;--green:#19745e;--line:#dce7e0;--paper:#fff;--bg:#f2f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Segoe UI',sans-serif}header{background:var(--paper);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:22px 5%;gap:20px}.brand{font-size:21px;font-weight:750;letter-spacing:-.7px}.brand b{background:var(--ink);color:#d7f2b5;border-radius:11px;padding:5px 10px;margin-right:10px}.brand small{display:block;font-size:10px;letter-spacing:2px;margin-left:46px;color:var(--muted)}main{max-width:1160px;margin:42px auto;padding:0 26px}h1{font-size:38px;font-weight:550;line-height:1.2;letter-spacing:-1.5px;margin:12px 0}h2{font-size:19px;font-weight:650;margin-top:0}h3{margin:0;font-size:16px}p{color:var(--muted)}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}.pill{display:inline-block;font-size:11px;letter-spacing:.7px;padding:5px 12px;border-radius:30px;background:#e8f1df;color:#326345}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}.notice{padding:13px 20px;border:1px solid #dce5ce;background:#f6f9ed;border-radius:12px;font-size:13px;color:#597046;margin:24px 0}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;margin:26px 0}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 8px 30px #143d3105}.account{background:var(--ink);color:white;position:relative;overflow:hidden}.account:after{content:'✧';position:absolute;right:25px;top:10px;font-size:140px;color:#ffffff0b;pointer-events:none}.account p{color:#b7d0c2}.account a{color:#d7f2b5}.money{font-size:43px;letter-spacing:-2px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:20px}table{width:100%;border-collapse:collapse}td,th{padding:15px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}td:last-child,th:last-child{text-align:right}label{display:block;font-size:12px;font-weight:650;margin:14px 0 6px}input,select{font:inherit;width:100%;padding:12px;border:1px solid #cedbd1;border-radius:9px;background:#fff;color:var(--ink)}button,.button{display:inline-block;background:var(--green);border:0;border-radius:10px;padding:12px 20px;color:white;font:600 13px 'Segoe UI',sans-serif;cursor:pointer;margin-top:18px}button:hover,.button:hover{background:#105d4a;text-decoration:none}.quiet{background:transparent;color:var(--green);border:1px solid var(--line);margin:0}.fine{font-size:12px}.login{max-width:460px;margin:75px auto}.result{max-width:780px;margin:35px auto}code{overflow-wrap:anywhere;font-size:12px;background:#edf3ed;padding:6px;border-radius:4px}footer{max-width:1160px;margin:40px auto;padding:0 26px;color:var(--muted);font-size:12px}.scenarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.danger{color:#a14235}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:30px}header{align-items:flex-start}.row{flex-wrap:wrap}.money{font-size:35px}table{font-size:12px}.card{padding:20px}}
</style></head><body><header><div class="brand"><b>✧</b>Northstar<small>FINANCE</small></div><div class="row"><span class="pill">FICTIONAL DEMO</span>{% if person %}<span class="fine">{{ person.name }}</span><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ person.csrf }}"><button class="quiet">Sign out</button></form>{% endif %}</div></header><main>{% block content %}{% endblock %}</main><footer>Northstar Finance · Two fictional organisations · No real funds, banks or payment networks connected.<br>AEGIS monitoring reports findings; access rules are enforced by Northstar.</footer></body></html>
